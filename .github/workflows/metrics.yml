name: "Lowlighter Metrics - Cyber Intelligence Dashboard"

on:
  # Schedule daily updates at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Run on push to main branch
  push: {branches: ["main", "master"]}
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛡️ Render Cyber Matrix Metrics
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Target user and output destination
          user: TheCyberIndia
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # Cyberpunk / Matrix Dark Palette
          config_theme: tokyonight
          config_padding: 0, 5%

          # 🌟 ISOMETRIC 3D CALENDAR (Hacker Style 3D Contribution Grid)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # 🏆 UNLOCKED CYBER ACHIEVEMENTS
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 8

          # 📊 CODING HABITS & TIME RADAR
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # 💻 PROGRAMMING LANGUAGES RADAR
          plugin_languages: yes
          plugin_languages_analysis_details: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

          # ⚡ LINES OF CODE
          plugin_lines: yes

          # 📈 FOLLOWUP (Status of issues & PRs)
          plugin_followup: yes
          plugin_followup_sections: user

          # Output destination
          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): 🛡️ Auto-update Cyber Intelligence metrics [skip ci]"
          filename: github-metrics.svg
